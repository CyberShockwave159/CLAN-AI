name: Build Windows Installer

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.x'
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows (${{ matrix.target }})
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      matrix:
        target: [x64]
        include:
          - target: x64
            flutter_target: windows-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup NSIS
        run: |
          $maxRetries = 3
          $retryDelay = 30
          $nsisInstalled = $false
          for ($i = 1; $i -le $maxRetries; $i++) {
            Write-Host "Attempting NSIS install (attempt $i of $maxRetries)..."
            if (choco install nsis -y --force --no-progress | Select-String -Pattern "Failed|error" -Quiet) {
              Write-Host "Install failed, retrying in ${retryDelay} seconds..."
              Start-Sleep -Seconds $retryDelay
              continue
            }
            $nsisInstalled = $true
            break
          }
          if (-not $nsisInstalled) {
            Write-Error "Failed to install NSIS after $maxRetries attempts"
            exit 1
          }
          $nsisDir = "C:\Program Files (x86)\NSIS"
          if (Test-Path "$nsisDir\makensis.exe") {
            echo "$nsisDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$nsisDir;$env:PATH"
          }
          makensis /VERSION
        shell: pwsh

      - name: Install Windows dependencies
        run: |
          flutter pub get
        shell: pwsh

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/flutter
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Build Windows release
        run: |
          flutter build windows --release
        shell: pwsh

      - name: Copy certificate to project
        run: |
          $certPath = "${{ secrets.CERT_PATH }}"
          if ($certPath) {
            Copy-Item $certPath -Destination "release\clan_ai_certificate.pfx" -Force
            echo "Certificate copied from $certPath"
          } else {
            echo "No certificate path specified, using existing cert"
          }
        shell: pwsh

      - name: Build MSIX package
        run: |
          dart run msix:create
        shell: pwsh

      - name: Verify MSIX output
        id: verify_msix
        run: |
          $msixFile = Get-ChildItem -Path build -Filter "*.msix" -Recurse -File | Select-Object -First 1
          if (-not $msixFile) {
            Write-Error "No MSIX files found after build"
            exit 1
          }
          Write-Host "Found MSIX: $($msixFile.FullName) ($([math]::Round($msixFile.Length/1MB, 2)) MB)"
          echo "msix_path=$($msixFile.FullName)" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Build NSIS installer
        run: |
          $msixPath = "${{ steps.verify_msix.outputs.msix_path }}"
          $version = (Get-Content pubspec.yaml | Select-String "version:").ToString().Split('+')[0].Trim()
          $installerName = "CLAN-AI_${version}_Setup.exe"
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Copy-Item $msixPath -Destination "dist\" -Force
          New-Item -ItemType Directory -Path "installer" -Force | Out-Null
          if (Test-Path "msix/assets/icon100x100.png") {
            Copy-Item "msix/assets/icon100x100.png" -Destination "installer\icon.png" -Force
            Write-Host "Copied icon.png (size: $((Get-Item 'installer\icon.png').Length) bytes)"
          } elseif (Test-Path "installer\icon.png") {
            Write-Host "Using existing icon.png"
          } else {
            Write-Warning "No icon found, creating minimal valid PNG"
            [System.IO.File]::WriteAllBytes("installer\icon.png", @(
              0x89,0x50,0x4E,0x47,0x0D,0x0A,0x1A,0x0A,
              0x00,0x00,0x00,0x0D,0x49,0x48,0x44,0x52,
              0x00,0x00,0x00,0x20,0x00,0x00,0x00,0x20,
              0x08,0x02,0x00,0x00,0x00,0x90,0x77,0x53,
              0xDE,0x00,0x00,0x00,0x0C,0x49,0x44,0x41,
              0x54,0x08,0xD7,0x63,0xF8,0xCF,0xC0,0x00,
              0x00,0x03,0x01,0x01,0x00,0x18,0xDD,0x8D,
              0xB4,0x00,0x00,0x00,0x00,0x49,0x45,0x4E,
              0x44,0xAE,0x42,0x60,0x82
            ))
            Write-Host "Created minimal PNG"
          }
          New-Item -ItemType Directory -Path "installer\dist" -Force | Out-Null
          makensis /DMSIX_SOURCE="dist\$(Split-Path $msixPath -Leaf)" /DDIST_DIR="dist" installer\nsis_installer.nsi
          Move-Item "installer\dist\CLAN-AI_Setup.exe" "dist\CLAN-AI_Setup.exe" -Force
        shell: pwsh

      - name: Generate checksums
        run: |
          $distDir = "dist"
          $files = Get-ChildItem -Path $distDir -File
          foreach ($f in $files) {
            $hash = Get-FileHash -Path $f.FullName -Algorithm SHA256
            "$($hash.Hash)  $($f.Name)" | Out-File -FilePath "$distDir\checksums.sha256" -Append -Encoding utf8
          }
          if (Test-Path "$distDir\README.txt") {
            Remove-Item "$distDir\README.txt" -Force
          }
          $version = (Get-Content pubspec.yaml | Select-String "version:").ToString().Split('+')[0].Trim()
          $date = Get-Date -Format "yyyy-MM-dd"
          $lines = @(
            "CLAN-AI Windows Installer",
            "=========================",
            "",
            "Files in this directory:",
            "",
            "  clan_ai_*.msix       - MSIX package (direct install)",
            "  CLAN-AI_*_Setup.exe  - NSIS installer (recommended)",
            "  checksums.sha256     - SHA-256 checksums for verification",
            "  README.txt           - This file",
            "",
            "Installation:",
            "  Method 1 (Recommended):",
            "    Double-click the CLAN-AI_*_Setup.exe installer",
            "",
            "  Method 2 (Direct):",
            "    Double-click the .msix file",
            "    If prompted about sideloading, enable it in:",
            "    Settings > Apps > Developer Options",
            "",
            "  Method 3 (PowerShell):",
            "    Add-AppxPackage -Path clan_ai_*.msix",
            "",
            "Requirements:",
            "  - Windows 10 (version 1809) or later",
            "  - Microsoft Account (for sideloading with self-signed cert)",
            "",
            "For more information: https://github.com/clan-ai/clan_ai"
          )
          $lines -join "`n" | Out-File -FilePath "$distDir\README.txt" -Encoding utf8
        shell: pwsh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clan-ai-windows-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: contains(github.ref, '-rc') || contains(github.ref, '-beta')
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
