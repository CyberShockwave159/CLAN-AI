name: Release Windows Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-channel: stable
          flutter-version: '3.47.x'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows binary
        run: flutter build windows --release
        shell: pwsh

      - name: Build MSIX package
        run: dart run msix:create
        shell: pwsh

      - name: Locate MSIX file
        id: locate_msix
        run: |
          $msix = Get-ChildItem -Path build -Filter "*.msix" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msix) {
            Write-Output "=== Build directory contents ==="
            Get-ChildItem -Path build -Recurse -Force -ErrorAction SilentlyContinue | Format-Table FullName, Length
            Write-Output "================================="
            Write-Error "MSIX file not found in build/"
            exit 1
          }
          echo "msix_path=$($msix.FullName)" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          echo "msix_name=$($msix.Name)" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Install NSIS
        run: |
          $maxRetries = 3
          $retryDelay = 30
          $nsisInstalled = $false
          for ($i = 1; $i -le $maxRetries; $i++) {
            Write-Host "Attempting NSIS install (attempt $i of $maxRetries)..."
            if (choco install nsis -y --no-progress | Select-String -Pattern "Failed|error" -Quiet) {
              Write-Host "Install failed, retrying in ${retryDelay} seconds..."
              Start-Sleep -Seconds $retryDelay
              continue
            }
            $nsisInstalled = $true
            break
          }
          if (-not $nsisInstalled) {
            Write-Error "Failed to install NSIS after $maxRetries attempts"
            exit 1
          }
        shell: pwsh

      - name: Build NSIS installer
        id: nsis
        run: |
          $msix = "${{ steps.locate_msix.outputs.msix_path }}"
          $dist_dir = "dist"
          New-Item -ItemType Directory -Force -Path $dist_dir | Out-Null
          $date_stamp = Get-Date -Format "yyyyMMdd"
          $msix_copy = Join-Path $dist_dir "clan_ai_${date_stamp}.msix"
          Copy-Item $msix $msix_copy
          $nsis_src = Join-Path $dist_dir "CLAN-AI_Setup.exe"
          $nsis_exe = Join-Path $dist_dir "CLAN-AI_${date_stamp}_Setup.exe"
          
          # Setup NSIS icon
          New-Item -ItemType Directory -Path "installer" -Force | Out-Null
          if (Test-Path "msix/assets/icon100x100.png") {
            Add-Type -AssemblyName System.Drawing
            $img = [System.Drawing.Image]::FromFile("msix/assets/icon100x100.png")
            $bmp = New-Object System.Drawing.Bitmap(32, 32)
            $gfx = [System.Drawing.Graphics]::FromImage($bmp)
            $gfx.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::HighQuality
            $gfx.InterpolationMode = [System.Drawing.InterpolationMode]::HighQualityBicubic
            $gfx.DrawImage($img, 0, 0, 32, 32)
            $bmp.Save("installer\icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $gfx.Dispose()
            $bmp.Dispose()
            $img.Dispose()
            Write-Host "Created icon.png (size: $((Get-Item 'installer\icon.png').Length) bytes)"
          } else {
            Write-Warning "No icon found, creating minimal valid PNG"
            [System.IO.File]::WriteAllBytes("installer\icon.png", @(
              0x89,0x50,0x4E,0x47,0x0D,0x0A,0x1A,0x0A,
              0x00,0x00,0x00,0x0D,0x49,0x48,0x44,0x52,
              0x00,0x00,0x00,0x20,0x00,0x00,0x00,0x20,
              0x08,0x02,0x00,0x00,0x00,0x90,0x77,0x53,
              0xDE,0x00,0x00,0x00,0x0C,0x49,0x44,0x41,
              0x54,0x08,0xD7,0x63,0xF8,0xCF,0xC0,0x00,
              0x00,0x03,0x01,0x01,0x00,0x18,0xDD,0x8D,
              0xB4,0x00,0x00,0x00,0x00,0x49,0x45,0x4E,
              0x44,0xAE,0x42,0x60,0x82
            ))
            Write-Host "Created minimal PNG"
          }
          
          # Find NSIS dynamically
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $makensis) {
            $fallback = "C:\Program Files (x86)\NSIS\makensis.exe"
            if (Test-Path $fallback) {
              $makensis = Get-Command $fallback -ErrorAction SilentlyContinue
            }
          }
          if (-not $makensis) {
            Write-Error "NSIS (makensis) not found. Ensure it is installed on the runner."
            exit 1
          }
          
          & $makensis.Path /DMSIX_SOURCE="$msix_copy" /DDIST_DIR="$dist_dir" installer\nsis_installer.nsi
          if ($LASTEXITCODE -ne 0) {
            Write-Error "NSIS build failed with exit code $LASTEXITCODE"
            exit 1
          }
          
          if (Test-Path $nsis_src) {
            Move-Item $nsis_src $nsis_exe -Force
            echo "nsis_path=$nsis_exe" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
            echo "nsis_name=$(Split-Path $nsis_exe -Leaf)" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          } else {
            Write-Error "NSIS installer not produced at $nsis_src"
            exit 1
          }
        shell: pwsh

      - name: Generate checksums
        run: |
          $dist_dir = "dist"
          $date_stamp = Get-Date -Format "yyyyMMdd"
          $msix_file = Get-ChildItem -Path $dist_dir -Filter "clan_ai_${date_stamp}.msix" -ErrorAction SilentlyContinue | Select-Object -First 1
          $nsis_file = Get-ChildItem -Path $dist_dir -Filter "CLAN-AI_${date_stamp}_Setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $hash_content = ""
          if ($msix_file) {
            $hash_content = "$($msix_file.Name)  " + (Get-FileHash $msix_file.FullName -Algorithm SHA256).Hash.ToLower()
          }
          if ($nsis_file) {
            if ($hash_content -ne "") { $hash_content += "`n" }
            $hash_content += "$($nsis_file.Name)  " + (Get-FileHash $nsis_file.FullName -Algorithm SHA256).Hash.ToLower()
          }
          if ($hash_content -ne "") {
            $hash_content | Out-File -FilePath "$dist_dir/checksums.sha256" -Encoding utf8
          }
        shell: pwsh

      - name: Generate release README
        run: |
          $dist_dir = "dist"
          $date_stamp = Get-Date -Format "yyyyMMdd"
          $lines = @(
            "CLAN-AI Windows Installer",
            "=========================",
            "",
            "Files in this directory:",
            "",
            "  clan_ai_${date_stamp}.msix      - MSIX package (direct install via double-click or PowerShell)",
            "  CLAN-AI_${date_stamp}_Setup.exe - NSIS installer (recommended)",
            "  checksums.sha256                 - SHA-256 checksums for verification",
            "",
            "Installation:",
            "",
            "  Method 1 (Recommended):",
            "    Double-click CLAN-AI_*.exe installer",
            "    Installs to %LOCALAPPDATA%\Programs\CLAN-AI\",
            "",
            "  Method 2 (Direct MSIX):",
            "    Double-click clan_ai_*.msix",
            "    Or: Add-AppxPackage -Path clan_ai_*.msix",
            "",
            "  Method 3 (PowerShell):",
            "    Add-AppxPackage -Path clan_ai_*.msix",
            "",
            "  If prompted about sideloading, enable:",
            "    Settings -> Apps -> Developer Options -> App Development Licenses",
            "",
            "Requirements:",
            "  - Windows 10 (version 1809) or later, 64-bit"
          )
          $lines -join "`n" | Out-File -FilePath "$dist_dir/README.txt" -Encoding utf8
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CLAN-AI ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.msix
            dist/*.exe
            dist/checksums.sha256
            dist/README.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
