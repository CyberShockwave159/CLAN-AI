name: clan_ai
description: "Frontier-class cross-platform llama.cpp client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^9.0.0
  image_picker: ^1.1.2
  provider: ^6.1.2
  http: ^1.2.1
  flutter_markdown: ^0.7.3
  flutter_highlight: ^0.7.0
  flutter_math_fork: ^0.7.2
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.18.0

flutter:
  uses-material-design: true

msix_config:
  display_name: CLAN-AI
  publisher_display_name: CLAN-AI Organization
  identity_name: clan-ai.clanai
  publisher: CN=CLANAIOrg
  msix_version: 1.0.0.0
  logo_path: msix/assets/icon100x100.png
  protocol_activation: clanai
  capabilities: internetClient, privateNetworkServerClient, removableStorage
  os_min_version: 10.0.17763.0
  enable_startup: false
  install_certificate: false

scripts:
  msix: dart run msix:create
